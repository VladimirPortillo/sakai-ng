<div class="grid">
	<div class="col-12">
		<div class="card">
			<h5>VER HOTEL</h5>
			<!-- Aqui va el contenido de la pagina -->
            <app-loading [loading]="loading"></app-loading>
            <div *ngIf="!loading">
            <form  [formGroup]="miFormulario">
                <div class="col-12">
                    <div class="p-fluid">
                        <div>
                            <div class="field grid">
                                <label htmlFor="nombre" class="col-12 mb-2 md:col-2 md:mb-0">Nombre:</label>
                                <div class="col-12 md:col-10">
                                    <input pInputText 
                                        id="nombre" 
                                        type="text"
                                        formControlName="nombre"
                                        />
                                    
                                </div>
                            </div>
                            <div class="field grid">
                                <label htmlFor="descripcion" class="col-12 mb-2 md:col-2 md:mb-0">Descripción:</label>
                                <div class="col-12 md:col-10">
                                    <input pInputText 
                                        id="descripcion" 
                                        type="text" 
                                        formControlName="descripcion"
                                        />
                                    
                                </div>
                            </div>
                            <div class="field grid">
                                <label htmlFor="direccion" class="col-12 mb-2 md:col-2 md:mb-0">Dirección:</label>
                                <div class="col-12 md:col-10">
                                    <input pInputText 
                                        id="direccion" 
                                        type="text"
                                        formControlName="direccion"
                                        />
                                    
                                </div>
                            </div>
                            <div class="field grid">
                                <label htmlFor="tipo" class="col-12 mb-2 md:col-2 md:mb-0">Estrellas:</label>
                                <div class="col-12 md:col-10">
                                    <div class="field-radiobutton">
                                    <p-radioButton 
                                            id="estrellas" 
                                            formControlName="estrellas"
                                            
                                            value="1">
                                        </p-radioButton>
                                        <label for="0">1 Estrella.</label>
                                        </div>
                                        <div class="field-radiobutton">
                                            <p-radioButton 
                                                id="estrellas" 
                                                formControlName="estrellas"
                                                
                                                value="2">
                                            </p-radioButton>
                                            <label for="0">2 Estrellas.</label>
                                        </div>
                                        <div class="field-radiobutton">
                                            <p-radioButton 
                                                id="estrellas" 
                                                formControlName="estrellas"
                                               
                                                value="3">
                                            </p-radioButton>
                                            <label for="0">3 Estrellas.</label>
                                        </div>
                                    
                                </div>
                            </div>
                            <div class="field grid">
                                <label htmlFor="tipo" class="col-12 mb-2 md:col-2 md:mb-0">Garaje:</label>
                                <div class="col-12 md:col-10">
                                    <div class="field-radiobutton">
                                    <p-radioButton 
                                            id="garaje" 
                                            formControlName="garaje"
                                           
                                            value="si">
                                        </p-radioButton>
                                        <label for="0">Si.</label>
                                        </div>
                                        <div class="field-radiobutton">
                                            <p-radioButton 
                                                id="garaje" 
                                                formControlName="garaje"
                                               
                                                value="no">
                                            </p-radioButton>
                                            <label for="0">No.</label>
                                        </div>
                                    
                                </div>
                            </div>
                            <div class="field grid">
                                <label htmlFor="tipo" class="col-12 mb-2 md:col-2 md:mb-0">Alimentación:</label>
                                <div class="col-12 md:col-10">
                                    <div class="field-radiobutton">
                                    <p-radioButton 
                                            id="alimentacion" 
                                            formControlName="alimentacion"
                                            
                                            value="Desayuno">
                                        </p-radioButton>
                                        <label for="0">Desayuno.</label>
                                        </div>
                                        <div class="field-radiobutton">
                                            <p-radioButton 
                                                id="alimentacion" 
                                                formControlName="alimentacion"
                                               
                                                value="Desayuno y almuerzo">
                                            </p-radioButton>
                                            <label for="0">Desayuno y almuerzo.</label>
                                        </div>
                                        <div class="field-radiobutton">
                                            <p-radioButton 
                                                id="alimentacion" 
                                                formControlName="alimentacion"
                                                
                                                value="Desayuno, almuerzo y cena">
                                            </p-radioButton>
                                            <label for="0">Desayuno, almuerzo y cena.</label>
                                        </div>
                                    
                                </div>
                            </div>
                            <div class="field grid">
                                <label htmlFor="tipo" class="col-12 mb-2 md:col-2 md:mb-0">Aire acondicionado:</label>
                                <div class="col-12 md:col-10">
                                    <div class="field-radiobutton">
                                    <p-radioButton 
                                            id="aire_acondicionado" 
                                            formControlName="aire_acondicionado"
                                            
                                            value="si">
                                        </p-radioButton>
                                        <label for="0">Si.</label>
                                        </div>
                                        <div class="field-radiobutton">
                                            <p-radioButton 
                                                id="aire_acondicionado" 
                                                formControlName="aire_acondicionado"
                                                value="no">
                                            </p-radioButton>
                                            <label for="0">No.</label>
                                        </div>
                                    
                                </div>
                            </div>
                            <div class="field grid">
                                <label htmlFor="telefono" class="col-12 mb-2 md:col-2 md:mb-0">Telefono:</label>
                                <div class="col-12 md:col-10">
                                    <input pInputText 
                                        id="telefono" 
                                        type="number" 
                                        formControlName="telefono"
                                        />
                                    
                                </div>
                            </div>
                            <div class="field grid">
                                <label htmlFor="comunidad" class="col-12 mb-2 md:col-2 md:mb-0">Comunidad a asignar:</label>
                                <div class="col-12 md:col-10">
                                    <p-dropdown 
                                        id="comunidad" 
                                        [options]="comunidades" 
                                        optionLabel="nombre" 
                                        placeholder="Seleccionar comunidad" 
                                        [showClear]="true"
                                        formControlName="comunidad"
                                    >
                                    </p-dropdown>
                                    
                                </div>
                            </div>
                            <div class="field grid">
                                <label 
                                    htmlFor="ubicacion" 
                                    class="col-12 mb-2 md:col-2 md:mb-0"
                                    >Ubicación en mapa:
                                </label>
                                <div class="col-12 md:col-10">
                                    <p>{{ datosCoordenada }}</p>
                                    <input 
                                        id="ubicacion"
                                        type="text" 
                                        pInputText
                                        formControlName="ubicacion"
                                    />
                                </div>
                                
                            </div>
                            <div class="field grid">
                                <label 
                                    htmlFor="mapa" 
                                    class="col-12 mb-2 md:col-2 md:mb-0">
                                </label>
                                <div class="col-12 md:col-10">
                                    <app-map
                                        (onReturnData)="coordenadasMapa($event)"
                                        [coordenadas]="coordenadas"
                                    ></app-map>
                                </div>   
                            </div>
                            <div class="field grid ">
                                <label 
                                    htmlFor="multimedia" 
                                    class="col-12 mb-2 md:col-2 md:mb-0">
                                    Multimedias:
                                </label>
                                <div class="col-12 md:col-10">
                                    <div class="card">
                                        <div class="image-container">
                                            <div *ngFor="let m of hotel.multimedias">
                                                <p-image 
                                                    [src]="urlPublic + m.ruta" 
                                                    alt="Image" 
                                                    width="150"
                                                    height="150"
                                                    [preview]="true"/>
                                                
                                            </div>
                                        </div>
                                    </div> 
                                </div>
                            </div>
                        </div>
                        <div class="field grid">
                            <div class="col-12 md:col-6"></div>
                            <div class="col-12 md:col-3">
                            </div>
                            <div class="col-12 md:col-3">
                                <p-button 
                                    (click)="volver()" 
                                    label="Volver" 
                                    styleClass="p-button-text">
                                </p-button>
                            </div>
                        </div>
                    </div>
                </div>
            </form>
            </div>
            <!-- Aqui va el contenido de la pagina -->
		</div>

	</div>

</div>
