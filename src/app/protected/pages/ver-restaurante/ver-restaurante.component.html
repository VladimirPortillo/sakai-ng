<div class="grid">
	<div class="col-12">
		<div class="card">
			<h5>VER RESTAURANTE</h5>
			<!-- Aqui va el contenido de la pagina -->
            <app-loading [loading]="loading"></app-loading>
            <div *ngIf="!loading">
            <form [formGroup]="miFormulario">
                <div class="col-12">
                    <div class="p-fluid">
                        <div>
                            <div class="field grid">
                                <label htmlFor="nombre" class="col-12 mb-2 md:col-2 md:mb-0">Nombre:</label>
                                <div class="col-12 md:col-10">
                                    <input pInputText 
                                        id="nombre" 
                                        type="text"
                                        formControlName="nombre"
                                        />
                                    
                                </div>
                            </div>
                            <div class="field grid">
                                <label htmlFor="descripcion" class="col-12 mb-2 md:col-2 md:mb-0">Descripción:</label>
                                <div class="col-12 md:col-10">
                                    <input pInputText 
                                        id="descripcion" 
                                        type="text" 
                                        formControlName="descripcion"
                                        />
                                    
                                </div>
                            </div>
                            <div class="field grid">
                                <label htmlFor="direccion" class="col-12 mb-2 md:col-2 md:mb-0">Dirección:</label>
                                <div class="col-12 md:col-10">
                                    <input pInputText 
                                        id="direccion" 
                                        type="text"
                                        formControlName="direccion"
                                        />
                                    
                                </div>
                            </div>
                            <div class="field grid">
                                <label 
                                    htmlFor="categoria" 
                                    class="col-12 mb-2 md:col-2 md:mb-0">
                                    Categoria:
                                </label>
                                <div class="col-12 md:col-10">
                                    <div class="field-radiobutton">
                                        <p-radioButton 
                                            id="categoria" 
                                            formControlName="categoria"
                                            
                                            value="mixto">
                                        </p-radioButton>
                                        <label for="0">Mixto.</label>
                                        </div>
                                        <div class="field-radiobutton">
                                            <p-radioButton 
                                                id="categoria" 
                                                formControlName="categoria"
                                                
                                                value="tradicional">
                                            </p-radioButton>
                                            <label for="0">Tradicional.</label>
                                        </div>
                                    
                                </div>
                            </div>
                            <div class="field grid">
                                <label htmlFor="telefono" class="col-12 mb-2 md:col-2 md:mb-0">Telefono:</label>
                                <div class="col-12 md:col-10">
                                    <input pInputText 
                                        id="telefono" 
                                        type="number" 
                                        formControlName="telefono"
                                        />
                                </div>
                            </div>
                            <div class="field grid">
                                <label htmlFor="categoria" class="col-12 mb-2 md:col-2 md:mb-0">Delivery:</label>
                                <div class="col-12 md:col-10">
                                    <div class="field-radiobutton">
                                        <p-radioButton 
                                            id="delivery" 
                                            formControlName="delivery"
                                            value="mixto">
                                        </p-radioButton>
                                        <label for="0">Si.</label>
                                        </div>
                                        <div class="field-radiobutton">
                                            <p-radioButton 
                                                id="delivery" 
                                                formControlName="delivery"
                                                value="tradicional">
                                            </p-radioButton>
                                            <label for="0">No.</label>
                                        </div>
                                    
                                </div>
                            </div>
                            <div class="field grid">
                                <label 
                                    htmlFor="comunidad" 
                                    class="col-12 mb-2 md:col-2 md:mb-0">
                                    Comunidad a asignar:
                                </label>
                                <div class="col-12 md:col-10">
                                    <p-dropdown 
                                        id="comunidad" 
                                        [options]="comunidades" 
                                        optionLabel="nombre" 
                                        placeholder="Seleccionar comunidad" 
                                        [showClear]="true"
                                        formControlName="comunidad"
                                    >
                                    </p-dropdown>
                                    
                                </div>
                            </div>
                            <div class="field grid">
                                <label 
                                    htmlFor="ubicacion" 
                                    class="col-12 mb-2 md:col-2 md:mb-0"
                                    >Ubicación en mapa:
                                </label>
                                <div class="col-12 md:col-10">
                                    <p>{{ datosCoordenada }}</p>
                                    <input 
                                        id="ubicacion"
                                        type="text" 
                                        pInputText
                                        formControlName="ubicacion"/>
                                    
                                </div>
                                
                            </div>
                            <div class="field grid">
                                <label 
                                    htmlFor="mapa" 
                                    class="col-12 mb-2 md:col-2 md:mb-0">
                                </label>
                                <div class="col-12 md:col-10">
                                    <app-map
                                        (onReturnData)="coordenadasMapa($event)"
                                        [coordenadas]="coordenadas"
                                    ></app-map>
                                </div>   
                            </div>
                            <div class="field grid ">
                                <label 
                                    htmlFor="multimedia" 
                                    class="col-12 mb-2 md:col-2 md:mb-0">
                                    Multimedias:
                                </label>
                                <div class="col-12 md:col-10">
                                    <div class="card">
                                        <div class="image-container">
                                            <div *ngFor="let m of restaurante.multimedias">
                                                <p-image 
                                                    [src]="urlPublic + m.ruta" 
                                                    alt="Image" 
                                                    width="150"
                                                    height="150"
                                                    [preview]="true"/>
                                                
                                            </div>
                                        </div>
                                    </div> 
                                </div>
                            </div>
                        </div>
                        <div class="field grid">
                            <div class="col-12 md:col-6"></div>
                            <div class="col-12 md:col-3">
                            </div>
                            <div class="col-12 md:col-3">
                                <p-button 
                                    (click)="volver()" 
                                    label="Volver" 
                                    styleClass="p-button-text">
                                </p-button>
                            </div>
                        </div>
                    </div>
                </div>
            </form>
            </div>
            <!-- Aqui va el contenido de la pagina -->
		</div>

	</div>

</div>
