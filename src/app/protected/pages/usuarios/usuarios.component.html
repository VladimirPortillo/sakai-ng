<div class="grid">
	<div class="col-12">
		<div class="card">
			<h5>ADMINISTRAR USUARIOS</h5>

			<!-- Aqui va el contenido de la pagina -->
			<p-table 
				[value]="usuarios" 
				#dt1 
				dataKey="id" 
				[rows]="10" 
				[rowHover]="true"
				styleClass="p-datatable-gridlines" 
				[paginator]="true" 
				[globalFilterFields]="['nombre']">
				<ng-template pTemplate="caption">
					<div class="flex justify-content-between flex-column sm:flex-row">
						<span 
							class="p-input-icon-left mb-2" 
							style="text-align:left;">
							<i class="pi pi-search">

							</i>
							<input 
								pInputText 
								type="text" 
								#filter 
								placeholder="Buscar..." 
								class="w-full"
								(input)="onGlobalFilter(dt1, $event)" 
							/>
						</span>
						<span style="text-align: right;">
							<button 
								pButton 
								pRipple 
								type="button"
								(click)="modalUsuario(null,1,'Agregar Usuario','Guardar')" 
								label="Agregar Usuario"
								class="p-button-secondary" 
								style="text-align: right;">
							</button>
						</span>
					</div>

                        <div class="col-12 md:col-2">
                            <div class="field-radiobutton">
                                <p-radioButton name="city" value="Chicago" ></p-radioButton>
                                <label for="city1">Todos.</label>
                            </div>
                        </div>
                        <div class="col-12 md:col-2">
                            <div class="field-radiobutton">
                                <p-radioButton name="city" value="Los Angeles" 
></p-radioButton>
                                <label for="city2">Activos.</label>
                            </div>
                        </div>
                        <div class="col-12 md:col-2">
                            <div class="field-radiobutton">
                                <p-radioButton name="city" value="New York"></p-radioButton>
                                <label for="city3">Eliminados.</label>
                            </div>
                        </div>
                        <div class="col-12 md:col-6">
                            <div class="field-radiobutton">
                               
                            </div>
                        </div>
                    </div> -->
				</ng-template>
				<ng-template pTemplate="header">
					<tr>
						<th style="min-width: 3rem">
							<div class="flex justify-content-between align-items-center">
								<span>Nº</span>
							</div>
						</th>
						<th pSortableColumn="nombre" style="min-width: 12rem">
							<div class="flex justify-content-between align-items-center">
								Nombre
								<p-sortIcon field="nombre"></p-sortIcon>
							</div>
						</th>
						<th style="min-width: 10rem">
							<div class="flex justify-content-between align-items-center">
								Ver
							</div>
						</th>
						<th style="min-width: 10rem">
							<div class="flex justify-content-between align-items-center">
								Editar
							</div>
						</th>
						<th style="min-width: 10rem">
							<div class="flex justify-content-between align-items-center"></div>
							Eliminar
						</th>
						<th style="min-width: 10rem">
							<div class="flex justify-content-between align-items-center">
								Habilitar
							</div>
						</th>
					</tr>
				</ng-template>
				<ng-template 
					pTemplate="body" 
					let-usuario 
					let-rowIndex="rowIndex">
					<tr>
						<td>
							{{ currentRowNumber + rowIndex + 1 }}
						</td>
						<td>
							{{usuario.nombre}} {{usuario.ap}} {{usuario.am}}
						</td>
						<td style="text-align: center;">
							<button 
								pButton 
								pRipple 
								type="button" 
								(click)="modalUsuario(usuario,0,'Ver Usuario','')"
								icon="pi pi-user" 
								class="p-button-rounded p-button-info p-button-outlined">
							</button>
						</td>
						<td style="text-align: center;">
							<button 
								pButton 
								pRipple 
								type="button"
								(click)="modalUsuario(usuario,2,'Editar Usuario','Editar')" 
								icon="pi pi-bookmark"
								class="p-button-rounded p-button-secondary p-button-outlined">
							</button>
						</td>
						<td style="text-align: center;">
							<button 
								pButton 
								pRipple 
								type="button"
								(click)="modalUsuario(usuario,3,'Eliminar Usuario','Eliminar')" 
								icon="pi pi-times"
								class="p-button-rounded p-button-danger p-button-outlined"
								[disabled]="usuario.estado === 0">
							</button>

						</td>
						<td style="text-align: center;">
							<button 
								pButton 
								pRipple 
								type="button"
								(click)="modalUsuario(usuario,4,'Habilitar Usuario','Habilitar')" 
								icon="pi pi-check"
								class="p-button-rounded p-button-outlined" 
								[disabled]="usuario.estado === 1">
							</button>
						</td>
					</tr>
				</ng-template>
				<ng-template pTemplate="emptymessage">
					<tr>
						<td colspan="8">No hay usuarios para mostrar.</td>
					</tr>
				</ng-template>
				<ng-template pTemplate="loadingbody">
					<tr>
						<td colspan="8">Cargando datos de los usuarios. Espere por favor.</td>
					</tr>
				</ng-template>
			</p-table>
			<p-button 
				label="Imprimir" 
				severity="secondary" 
				(click)="onImprimir()" 
			/>
			<!-- modal -->
			<p-dialog 
				header="Header" 
				[(visible)]="modalUsuarioVisible" 
				[modal]="true" 
				[style]="{ width: '40vw' }">

				<ng-template pTemplate="header">
					<span class="text-xl font-bold">{{ modalTitle }}</span>
				</ng-template>

				<app-modal-usuario 
					*ngIf="modalUsuarioVisible" 
					[titleButton]="titleButton" 
					[usuario]="dataUsuario"
					[tipoAccion]="tipoAccion" 
					(onCloseModal)="cerrarModal($event)"
					(onSaveDataModal)="datosGuardadosModal($event)">
				</app-modal-usuario>

			</p-dialog>

			<!-- Aqui va el contenido de la pagina -->

		</div>

	</div>

</div>
