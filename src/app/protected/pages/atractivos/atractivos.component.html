<div class="grid">
	<div class="col-12">
		<div class="card">
			<h5>ADMINISTRAR ATRACTIVOS TURISTICOS</h5>

			<!-- Aqui va el contenido de la pagina -->
			<p-table 
				[value]="atractivos" 
				#dt1 
				dataKey="id" 
				[rows]="10" 
				[rowHover]="true"
				styleClass="p-datatable-gridlines" 
				[paginator]="true" 
				[globalFilterFields]="['nombre']">
				<ng-template pTemplate="caption">
					<div class="flex justify-content-between flex-column sm:flex-row">
						<span class="p-input-icon-left mb-2" style="text-align:left;">
							<i class="pi pi-search"></i>
							<input 
								pInputText 
								type="text" 
								#filter 
								placeholder="Buscar..." 
								class="w-full"
								(input)="onGlobalFilter(dt1, $event)" />
						</span>
						<span style="text-align: right;">
							<button 
								pButton 
								pRipple 
								type="button"
								(click)="agregarAtractivo()"
								label="Agregar Atractivo Turistico" 
								class="p-button-secondary"
								style="text-align: right;">
							</button>
						</span>
					</div>
					
				</ng-template>
				<ng-template pTemplate="header">
					<tr>
						<th style="min-width: 3rem">
							<div class="flex justify-content-between align-items-center">
								<span>Nº</span>
							</div>
						</th>
						<th pSortableColumn="nombre" style="min-width: 12rem">
							<div class="flex justify-content-between align-items-center">
								Nombre
								<p-sortIcon field="nombre"></p-sortIcon>
							</div>
						</th>
						<th style="min-width: 10rem">
							<div class="flex justify-content-between align-items-center">
								Ver
							</div>
						</th>
						<th style="min-width: 10rem">
							<div class="flex justify-content-between align-items-center">
								Editar
							</div>
						</th>
						<th style="min-width: 10rem">
							<div class="flex justify-content-between align-items-center"></div>
							Eliminar
						</th>
						<th style="min-width: 10rem">
							<div class="flex justify-content-between align-items-center">
								Habilitar
							</div>
						</th>
					</tr>
				</ng-template>
				<ng-template pTemplate="body" let-atractivo let-rowIndex="rowIndex">
					<tr>
						<td>
							{{ currentRowNumber + rowIndex + 1 }}
						</td>
						<td>
							{{atractivo.nombre}}
						</td>
						<td style="text-align: center;">
							<button 
								pButton 
								pRipple 
								type="button"
								(click)="verAtractivo(atractivo.id_atractivo)" 
								icon="pi pi-user"
								class="p-button-rounded p-button-info p-button-outlined">
							</button>
						</td>
						<td style="text-align: center;">
							<button 
								pButton 
								pRipple 
								type="button"
								(click)="editarAtractivo(atractivo.id_atractivo)"
								icon="pi pi-bookmark"
								class="p-button-rounded p-button-secondary p-button-outlined">
							</button>
						</td>
						<td style="text-align: center;">
							<button 
								pButton 
								pRipple 
								type="button"
								(click)="modalAtractivo(atractivo,3,'Eliminar Atractivo Turistico','Eliminar')"
								icon="pi pi-times" 
								class="p-button-rounded p-button-danger p-button-outlined"
								[disabled]="atractivo.estado === 0">
							</button>

						</td>
						<td style="text-align: center;">
							<button 
								pButton 
								pRipple 
								type="button"
								(click)="modalAtractivo(atractivo,4,'Habilitar Atractivo Turistico','Habilitar')"
								icon="pi pi-check" 
								class="p-button-rounded p-button-outlined"
								[disabled]="atractivo.estado === 1">
							</button>
						</td>
					</tr>
				</ng-template>
				<ng-template pTemplate="emptymessage">
					<tr>
						<td colspan="8">No hay atractivos turisticos para mostrar.</td>
					</tr>
				</ng-template>
				<ng-template pTemplate="loadingbody">
					<tr>
						<td colspan="8">Loading customers data. Please wait.</td>
					</tr>
				</ng-template>
			</p-table>
			<p-button 
				label="Imprimir lista" 
				severity="secondary" 
				(click)="onImprimir()" 
			/>
			<!-- modal -->
			<p-dialog 
				header="Header" 
				[(visible)]="modalAtractivoVisible" 
				[modal]="true" 
				[style]="{ width: '40vw' }">

				<ng-template pTemplate="header">
					<span class="text-xl font-bold">{{ modalTitle }}</span>
				</ng-template>

				<app-modal-atractivo 
					*ngIf="modalAtractivoVisible" 
					[titleButton]="titleButton"
					[atractivo]="dataAtractivo" 
					[tipoAccion]="tipoAccion" 
					(onCloseModal)="cerrarModal($event)"
					(onSaveDataModal)="datosGuardadosModal($event)">
				</app-modal-atractivo>

			</p-dialog>
			<!-- Aqui va el contenido de la pagina -->

		</div>

	</div>

</div>
