<div class="grid">
	<div class="col-12">
		<div class="card">
			<h5>VER GASTRONOMIA</h5>
			<!-- Aqui va el contenido de la pagina -->
            <app-loading [loading]="loading"></app-loading>
            <div *ngIf="!loading">
            <form [formGroup]="miFormulario">
                <div class="col-12">
                    <div class="p-fluid">
                        <div>
                            <div class="field grid">
                                <label htmlFor="nombre" class="col-12 mb-2 md:col-2 md:mb-0">Nombre:</label>
                                <div class="col-12 md:col-10">
                                    <input pInputText 
                                        id="nombre" 
                                        type="text"
                                        formControlName="nombre"
                                        />
                                    
                                </div>
                            </div>
                            <div class="field grid">
                                <label htmlFor="descripcion" class="col-12 mb-2 md:col-2 md:mb-0">Descripción:</label>
                                <div class="col-12 md:col-10">
                                    <input pInputText 
                                        id="descripcion" 
                                        type="text" 
                                        formControlName="descripcion"
                                        />
                                
                                </div>
                            </div>
                            <div class="field grid">
                                <label htmlFor="tipo" class="col-12 mb-2 md:col-2 md:mb-0">Tipo:</label>
                                <div class="col-12 md:col-10">
                                    <div class="field-radiobutton">
                                        <p-radioButton 
                                            id="tipo" 
                                            formControlName="tipo"
                                            
                                            value="comida">
                                        </p-radioButton>
                                        <label for="0">Comida.</label>
                                    </div>
                                    <div class="field-radiobutton">
                                        <p-radioButton 
                                            id="tipo" 
                                            formControlName="tipo"
                                            
                                            value="bebida">
                                        </p-radioButton>
                                        <label for="0">Bebida.</label>
                                    </div>
                               
                                </div>
                            </div>
                            <div class="field grid">
                                <label htmlFor="comunidad" class="col-12 mb-2 md:col-2 md:mb-0">Comunidad a asignar:</label>
                                <div class="col-12 md:col-10">
                                    <p-multiSelect 
                                        id="comunidad" 
                                        [options]="comunidades" 
                                        placeholder="Seleccionar Comunidades" 
                                        optionLabel="nombre" 
                                        class="multiselect-custom" 
                                        formControlName="comunidades"
                                        display="chip"> 
                                                <ng-template let-comunidad pTemplate="item">
                                                    <div class="flex align-items-center">
                                                        <span class="ml-2">{{comunidad.nombre}}</span>
                                                    </div>
                                                </ng-template>
                                    </p-multiSelect>
                                </div>
                            </div>
                            <div class="field grid ">
                                <label 
                                    htmlFor="multimedia" 
                                    class="col-12 mb-2 md:col-2 md:mb-0">
                                    Multimedias:
                                </label>
                                <div class="col-12 md:col-10">
                                    <div class="card">
                                        <div class="image-container">
                                            <div *ngFor="let m of gastronomia.multimedias">
                                                <p-image 
                                                    [src]="urlPublic + m.ruta" 
                                                    alt="Image" 
                                                    width="150"
                                                    height="150"
                                                    [preview]="true"/>
                                                
                                            </div>
                                        </div>
                                    </div> 
                                </div>
                            </div>
                        </div>
                        <div class="field grid">
                            <div class="col-12 md:col-6"></div>
                            <div class="col-12 md:col-3">
                            </div>
                            <div class="col-12 md:col-3">
                                <p-button 
                                    (click)="volver()" 
                                    label="Volver" 
                                    styleClass="p-button-text">
                                </p-button>
                            </div>
                        </div>
                    </div>
                </div>
            </form>
            </div>
            <!-- Aqui va el contenido de la pagina -->
		</div>

	</div>

</div>
