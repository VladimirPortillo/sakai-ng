<div class="grid">
	<div class="col-12">
		<div class="card">
			<h5>ADMINISTRAR HOTELES</h5>

            <!-- Aqui va el contenido de la pagina -->
            <p-table [value]="hoteles" #dt1  dataKey="id" [rows]="5"  [rowHover]="true" styleClass="p-datatable-gridlines" 
                    [paginator]="true"  [globalFilterFields]="['nombre']">
				<ng-template pTemplate="caption">
					<div class="flex justify-content-between flex-column sm:flex-row">     
						<span class="p-input-icon-left mb-2" style="text-align:left;">
							<i class="pi pi-search"></i>
							<input pInputText type="text" #filter  placeholder="Buscar..." class="w-full" (input)="onGlobalFilter(dt1, $event)"/>
						</span>
                        <span style="text-align: right;">
                            <button pButton pRipple type="button"  (click)="modalHotel(null,1,'Agregar Hotel','Guardar')" label="Agregar Hotel" class="p-button-secondary" style="text-align: right;"></button>
                        </span>
					</div>
                    <!-- <div class="grid formgrid">
                        <div class="col-12 md:col-2">
                            <div class="field-radiobutton">
                                <p-radioButton name="city" value="Chicago" ></p-radioButton>
                                <label for="city1">Todos.</label>
                            </div>
                        </div>
                        <div class="col-12 md:col-2">
                            <div class="field-radiobutton">
                                <p-radioButton name="city" value="Los Angeles" 
                                               ></p-radioButton>
                                <label for="city2">Activos.</label>
                            </div>
                        </div>
                        <div class="col-12 md:col-2">
                            <div class="field-radiobutton">
                                <p-radioButton name="city" value="New York"></p-radioButton>
                                <label for="city3">Eliminados.</label>
                            </div>
                        </div>
                        <div class="col-12 md:col-6">
                            <div class="field-radiobutton">
                               
                            </div>
                        </div>
                    </div> -->
				</ng-template>
				<ng-template pTemplate="header">
					<tr>
                        <th style="min-width: 3rem">
							<div class="flex justify-content-between align-items-center">
								<span>Nº</span>
							</div>
						</th>
						<th pSortableColumn="nombre" style="min-width: 10rem">
							<div class="flex justify-content-between align-items-center">
								Nombre
								<p-sortIcon field="nombre"></p-sortIcon>
							</div>
						</th>
                        <th style="min-width: 10rem">
							<div class="flex justify-content-between align-items-center">
								Ver
							</div>
						</th>
						<th style="min-width: 10rem">
							<div class="flex justify-content-between align-items-center">
								Editar
							</div>
						</th>
						<th style="min-width: 10rem">
							<div class="flex justify-content-between align-items-center"></div>
								Eliminar
						</th>
						<th style="min-width: 10rem">
							<div class="flex justify-content-between align-items-center">
								Habilitar
							</div>
						</th>
					</tr>
				</ng-template>
				<ng-template pTemplate="body" let-hotel>
					<tr>
						<td>
                            {{hotel.id_hotel}}
						</td>
						<td>
                            {{hotel.nombre}}
						</td>
                        <td style="text-align: center;">
                            <button pButton pRipple type="button"  (click)="modalHotel(hotel,0,'Ver Hotel','')" icon="pi pi-user" class="p-button-rounded p-button-info p-button-outlined" ></button>
						</td>
						<td style="text-align: center;">
                            <button pButton pRipple type="button" (click)="modalHotel(hotel,2,'Editar Hotel','Editar')" icon="pi pi-bookmark" class="p-button-rounded p-button-secondary p-button-outlined" ></button>
						</td>
						<td style="text-align: center;">
                            <button  pButton pRipple type="button" (click)="modalHotel(hotel,3,'Eliminar Hotel','Eliminar')" icon="pi pi-times" class="p-button-rounded p-button-danger p-button-outlined" ></button>
							
						</td>
                        <td style="text-align: center;">
                            <button pButton pRipple type="button" (click)="modalHotel(hotel,4,'Habilitar Hotel','Habilitar')" icon="pi pi-check" class="p-button-rounded p-button-outlined" ></button>
                        </td>
					</tr>
				</ng-template>
				<ng-template pTemplate="emptymessage">
					<tr>
						<td colspan="8">No hay hoteles para mostrar.</td>
					</tr>
				</ng-template>
				<ng-template pTemplate="loadingbody">
					<tr>
						<td colspan="8">Cargando datos de los hoteles. Espere por favor.</td>
					</tr>
				</ng-template>
    		</p-table>
               <!-- modal -->
               <p-dialog header="Header" [(visible)]="modalHotelVisible" [modal]="true" [style]="{ width: '40vw' }">
            
                <ng-template pTemplate="header">
                    <span class="text-xl font-bold" >{{ modalTitle }}</span>
                </ng-template>

                <app-modal-hotel *ngIf="modalHotelVisible"
                    [titleButton]="titleButton" 
                    [hotel]="dataHotel" 
                    [tipoAccion]="tipoAccion"
                    (onCloseModal)="cerrarModal($event)"
                    (onSaveDataModal)="datosGuardadosModal($event)"
                ></app-modal-hotel>
				
            </p-dialog>
            <!-- Aqui va el contenido de la pagina -->
			
		</div>

	</div>

</div>
